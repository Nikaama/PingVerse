<em><%= message.timestamp %></em>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Room | PingVerse</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"></link>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
        }
    </style>
</head>
<body class="min-h-screen bg-gray-100 relative bg-fixed bg-cover" style="background-image: url('https://storage.googleapis.com/a1aa/image/2b5gfJgyUhSqQy1TkbxaMVXfX5vNIn6e5SE95gaT7EZtgwCoA.jpg'); background-size: cover; background-position: center;">
    <!-- Background Overlay -->
    <div class="absolute inset-0 bg-black bg-opacity-60"></div>
    <!-- Header -->
    <header class="bg-gray-900 text-white py-6 shadow-md">
        <div class="container mx-auto px-4 flex justify-between items-center">
            <h1 class="text-lg font-bold font-poppins tracking-wide">
                Welcome, <%= user %>
            </h1>
            <nav class="flex space-x-4">
                <a href="/" class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-full shadow-lg flex items-center transition-transform transform hover:scale-105 font-poppins">
                    <i class="fas fa-home mr-2"></i>
                    <span class="hidden sm:inline">Home</span>
                </a>
                <a href="/logout" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-full shadow-lg flex items-center transition-transform transform hover:scale-105 font-poppins">
                    <i class="fas fa-sign-out-alt mr-2"></i>
                    <span class="hidden sm:inline">Logout</span>
                </a>
            </nav>
        </div>
    </header>
    <!-- Main Content -->
    <main class="container mx-auto px-4 py-8 relative z-10">
        <h2 class="text-2xl font-bold mb-4 text-white">Chat Room</h2>
        <div class="bg-white bg-opacity-80 rounded-lg shadow-md p-6 mb-6 max-w-4xl mx-auto relative">
            <h1 class="text-2xl font-bold mb-4 text-center">Welcome to the Chat Room, <%= user %></h1>
            <div id="chat-box" class="bg-gray-50 border border-gray-200 rounded-lg p-4 mb-4 h-96 overflow-y-auto">
                <ul id="messages">
                    <% messages.forEach(message => { %>
                        <li>
                            <strong><%= message.username %>:</strong> <%= message.message %>
                            <em><%= message.timestamp %></em>
                        </li>
                    <% }); %>
                </ul>
            </div>
            <form id="chat-form" class="flex">
                <input id="message" autocomplete="off" placeholder="Type a message..." class="flex-grow p-2 border border-gray-300 rounded-l-lg focus:outline-none focus:ring-2 focus:ring-blue-500" />
                <button class="bg-blue-500 text-white p-2 rounded-r-lg hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </form>
        </div>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        // Send chat message
        const form = document.getElementById('chat-form');
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const message = document.getElementById('message').value;
            const username = '<%= user %>'; // Pass username from server-side
            socket.emit('chatMessage', { username, content: message });
            document.getElementById('message').value = '';
        });

        // Receive chat message
        const messages = document.getElementById('messages');
        socket.on('chatMessage', (msg) => {
            const li = document.createElement('li');
            li.classList.add('p-2', 'bg-white', 'rounded', 'shadow');
            li.innerHTML = `<strong class="text-blue-600">${msg.username}:</strong> ${msg.content} <em class="text-gray-500 text-sm">(${new Date(msg.timestamp).toLocaleTimeString()})</em>`;
            messages.appendChild(li);
        });
    </script>
</body>
</html>
